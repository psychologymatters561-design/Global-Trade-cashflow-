  Transport:   "#60a5fa",
  Material:    "#9ca3af",
  Precious:    "#fbbf24"
};

/* ─── TICKER BAR ─── */
function TickerBar() {
  return ce("div", {
    style: {
      background: C.bg2,
      borderBottom: "1px solid " + C.border,
      padding: "0.875rem clamp(1rem, 5vw, 2.5rem)",
      display: "flex",
      gap: "clamp(1.25rem, 3vw, 2.5rem)",
      overflowX: "auto",
      scrollbarWidth: "none",
      WebkitOverflowScrolling: "touch",
      flexWrap: "wrap"
    }
  }, TICKER.map(function(item, i) {
    return ce("div", { key: i, style: { display: "flex", flexDirection: "column", minWidth: 130, flexShrink: 0 } },
      ce("div", { style: { fontSize: "0.58rem", letterSpacing: "2px", color: C.muted, textTransform: "uppercase", marginBottom: 3, fontFamily: "'DM Mono', monospace" } }, item.label),
      ce("div", { style: { fontSize: "1.2rem", fontFamily: "'DM Mono', monospace", color: item.col, fontWeight: 700, lineHeight: 1.2 } }, item.value),
      item.note && ce("div", { style: { fontSize: "0.62rem", color: C.dim, marginTop: 2 } }, item.note)
    );
  }));
}

/* ─── SECTOR BAR ROW ─── */
function SectorBar(props) {
  var item = props.item;
  var max = props.max || 1;
  var barColor = CAT_COLORS[item.cat] || C.gold;
  var barWidth = Math.max(2, Math.round((item.pct / max) * 100));
  return ce("div", { style: { marginBottom: "0.625rem" } },
    ce("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.2rem", gap: "0.5rem" } },
      ce("span", { style: { fontSize: "0.8rem", color: C.text, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, item.n),
      ce("div", { style: { display: "flex", gap: "0.5rem", alignItems: "center", flexShrink: 0 } },
        ce("span", { style: { fontSize: "0.75rem", color: C.muted, fontFamily: "'DM Mono', monospace" } }, item.v),
        ce("span", { style: { fontSize: "0.6rem", background: C.bg3, color: barColor, padding: "1px 5px", borderRadius: 2, fontFamily: "'DM Mono', monospace", border: "1px solid " + barColor + "44" } }, item.cat)
      )
    ),
    ce("div", { style: { height: 4, background: C.bg3, borderRadius: 2 } },
      ce("div", { style: { height: "100%", width: barWidth + "%", background: barColor, borderRadius: 2 } })
    )
  );
}

/* ─── TAB NAV ─── */
var TABS = [
  { id: "overview",      label: "OVERVIEW" },
  { id: "partners",      label: "PARTNERS" },
  { id: "sectors",       label: "SECTORS" },
  { id: "events",        label: "EVENTS" },
  { id: "intelligence",  label: "INTELLIGENCE" }
];

function TabNav(props) {
  var active = props.active;
  var onChange = props.onChange;
  return ce("div", {
    style: {
      display: "flex",
      borderBottom: "1px solid " + C.border,
      marginBottom: "1.5rem",
      overflowX: "auto",
      scrollbarWidth: "none"
    }
  }, TABS.map(function(tab) {
    var isActive = active === tab.id;
    return ce("button", {
      key: tab.id,
      onClick: function() { onChange(tab.id); },
      style: {
        background: "none",
        border: "none",
        borderBottom: isActive ? "2px solid " + C.gold : "2px solid transparent",
        color: isActive ? C.gold : C.muted,
        padding: "0.75rem clamp(0.6rem, 2vw, 1.1rem)",
        fontSize: "0.65rem",
        letterSpacing: "2px",
        textTransform: "uppercase",
        fontFamily: "'DM Mono', monospace",
        cursor: "pointer",
        minHeight: 0,
        whiteSpace: "nowrap",
        transition: "color 0.2s"
      }
    }, tab.label);
  }));
}

/* ─── OVERVIEW TAB ─── */
function OverviewTab(props) {
  var n = props.nation;
  return ce(React.Fragment, null,
    ce("div", { style: { marginBottom: "1.5rem" } },
      ce("div", { style: { fontSize: "0.6rem", letterSpacing: "2px", color: C.muted, textTransform: "uppercase", marginBottom: "0.75rem", fontFamily: "'DM Mono', monospace" } }, "KEY TRADE VITALS — LATEST 2026 DATA"),
      ce("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(175px, 1fr))", gap: "0.5rem" } },
        n.vitals.map(function(v, i) {
          var dColor = v.d && v.d.charAt(0) === "+" ? C.green : v.d && (v.d.charAt(0) === "−" || v.d.charAt(0) === "-") ? C.red : C.dim;
          return ce("div", { key: i, style: { background: C.bg3, border: "1px solid " + C.border, borderRadius: 4, padding: "0.75rem" } },
            ce("div", { style: { fontSize: "0.6rem", color: C.muted, letterSpacing: "1px", textTransform: "uppercase", marginBottom: "0.25rem", fontFamily: "'DM Mono', monospace" } }, v.k),
            ce("div", { style: { fontSize: "1.3rem", color: C.goldL, fontFamily: "'DM Mono', monospace", fontWeight: 700, lineHeight: 1.2 } }, v.v),
            ce("div", { style: { fontSize: "0.68rem", color: C.text, marginTop: "0.2rem" } }, v.s),
            ce("div", { style: { fontSize: "0.65rem", color: dColor, marginTop: "0.15rem", fontFamily: "'DM Mono', monospace" } }, v.d)
          );
        })
      )
    ),
    ce("div", null,
      ce("div", { style: { fontSize: "0.6rem", letterSpacing: "2px", color: C.muted, textTransform: "uppercase", marginBottom: "0.75rem", fontFamily: "'DM Mono', monospace" } }, "TRADE VOLUME 2019–2025 (USD BILLIONS) — GOLD: EXPORTS · RED: IMPORTS · 2026 IS PART-YEAR, SEE VITALS"),
      (!CHARTS_OK
        ? ce("div", { style: { padding: "1.25rem", border: "1px dashed " + C.border, borderRadius: 4, color: C.muted, fontSize: "0.8rem", fontFamily: "'DM Mono', monospace" } },
            "Chart library unavailable — trade volumes for " + n.short + ": " +
            n.trade6.map(function(d){ return d.y + " exports $" + d.x + "B / imports $" + d.m + "B"; }).join(" · "))
        : ce(ResponsiveContainer, { width: "100%", height: 260 },
        ce(BarChart, { data: n.trade6, margin: { top: 10, right: 20, left: 0, bottom: 10 } },
          ce(XAxis, { dataKey: "y", stroke: C.muted, fontSize: 11, tick: { fill: C.muted } }),
          ce(YAxis, { stroke: C.muted, fontSize: 11, tick: { fill: C.muted } }),
          ce(Tooltip, {
            contentStyle: { background: C.bg4, border: "1px solid " + C.border, borderRadius: 4, color: C.text, fontSize: "0.8rem" },
            formatter: function(value, name) { return ["$" + value + "B", name === "x" ? "Exports" : "Imports"]; }
          }),
          ce(Bar, { dataKey: "x", fill: C.gold,      radius: [2,2,0,0], name: "Exports" }),
          ce(Bar, { dataKey: "m", fill: C.red, opacity: 0.8, radius: [2,2,0,0], name: "Imports" })
        )
      ))
    )
  );
}

/* ─── PARTNERS TAB ─── */
function PartnersTab(props) {
  var n = props.nation;
  function PartnerList(pProps) {
    var partners = pProps.partners;
    var valueColor = pProps.valueColor || C.goldL;
    var barColor = pProps.barColor || C.gold;
    return ce("div", null,
      partners.map(function(p, i) {
        var barPct = Math.min(100, p.p || 10);
        return ce("div", { key: i, style: { display: "flex", alignItems: "flex-start", gap: "0.75rem", padding: "0.5rem 0", borderBottom: "1px solid " + C.border + "88" } },
          ce("div", { style: { fontSize: "0.65rem", color: C.muted, fontFamily: "'DM Mono', monospace", width: 20, textAlign: "right", flexShrink: 0, paddingTop: 3 } }, i + 1),
          ce("div", { style: { flex: 1, minWidth: 0 } },
            ce("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: 4 } },
              ce("span", { style: { fontSize: "0.875rem", color: C.bright, fontWeight: 600 } }, p.c),
              ce("span", { style: { fontSize: "0.78rem", color: valueColor, fontFamily: "'DM Mono', monospace" } }, p.v)
            ),
            ce("div", { style: { height: 3, background: C.bg3, borderRadius: 2, marginBottom: 3 } },
              ce("div", { style: { height: "100%", width: barPct + "%", background: barColor, borderRadius: 2, opacity: 0.7 } })
            ),
            ce("div", { style: { fontSize: "0.63rem", color: C.dim } }, p.note + (p.p ? " · " + p.p + "% share" : ""))
          )
        );
      })
    );
  }
  return ce("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(270px, 1fr))", gap: "1.5rem" } },
    ce("div", null,
      ce("div", { style: { fontSize: "0.6rem", letterSpacing: "2px", color: C.muted, textTransform: "uppercase", marginBottom: "0.75rem", fontFamily: "'DM Mono', monospace" } }, "TOP EXPORT DESTINATIONS — 2025 SHARES · 2026 MOVEMENT IN NOTES"),
      ce(PartnerList, { partners: n.expPartners, valueColor: C.goldL, barColor: C.gold })
    ),
    ce("div", null,
      ce("div", { style: { fontSize: "0.6rem", letterSpacing: "2px", color: C.muted, textTransform: "uppercase", marginBottom: "0.75rem", fontFamily: "'DM Mono', monospace" } }, "TOP IMPORT SOURCES — 2025 SHARES · 2026 MOVEMENT IN NOTES"),
      ce(PartnerList, { partners: n.impPartners, valueColor: C.red, barColor: C.red })
    )
  );
}

/* ─── SECTORS TAB ─── */
function SectorsTab(props) {
  var n = props.nation;
  var maxExp = Math.max.apply(null, n.topExports.map(function(e) { return e.pct; }));
  var maxImp = Math.max.apply(null, n.topImports.map(function(e) { return e.pct; }));
  return ce("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: "1.5rem" } },
    ce("div", null,
      ce("div", { style: { fontSize: "0.6rem", letterSpacing: "2px", color: C.muted, textTransform: "uppercase", marginBottom: "0.875rem", fontFamily: "'DM Mono', monospace" } }, "TOP EXPORT COMMODITIES & SECTORS — 2025 FULL-YEAR COMPOSITION"),
      n.topExports.map(function(item, i) {
        return ce(SectorBar, { key: i, item: item, max: maxExp });
      })
    ),
    ce("div", null,
      ce("div", { style: { fontSize: "0.6rem", letterSpacing: "2px", color: C.muted, textTransform: "uppercase", marginBottom: "0.875rem", fontFamily: "'DM Mono', monospace" } }, "TOP IMPORT COMMODITIES & SECTORS — 2025 FULL-YEAR COMPOSITION"),
      n.topImports.map(function(item, i) {
        return ce(SectorBar, { key: i, item: item, max: maxImp });
      })
    )
  );
}

/* ─── EVENTS TAB ─── */
function EventsTab(props) {
  var n = props.nation;
  return ce("div", { style: { position: "relative", paddingLeft: "1.75rem" } },
    ce("div", { style: { position: "absolute", left: 6, top: 8, bottom: 8, width: 1, background: C.border } }),
    n.events.map(function(ev, i) {
      return ce("div", { key: i, style: { position: "relative", paddingBottom: "1.375rem" } },
        ce("div", { style: { position: "absolute", left: "-1.85rem", top: 5, width: 9, height: 9, borderRadius: "50%", background: C.gold, border: "2px solid " + C.bg, boxShadow: "0 0 6px " + C.gold + "66" } }),
        ce("div", { style: { fontSize: "0.68rem", fontFamily: "'DM Mono', monospace", color: C.goldL, letterSpacing: "2px", marginBottom: "0.3rem", textTransform: "uppercase" } }, ev.y),
        ce("div", { style: { fontSize: "0.875rem", color: C.text, lineHeight: 1.7 } }, ev.t)
      );
    })
  );
}

/* ─── INTELLIGENCE TAB ─── */
function IntelTab(props) {
  var n = props.nation;
  return ce(React.Fragment, null,
    ce("div", {
      style: {
        background: "linear-gradient(135deg, " + C.bg3 + " 0%, " + C.bg4 + " 100%)",
        border: "1px solid " + C.border,
        borderLeft: "3px solid " + C.gold,
        borderRadius: 4,
        padding: "1.125rem",
        marginBottom: "1rem"
      }
    },
      ce("div", { style: { fontSize: "0.58rem", letterSpacing: "3px", color: C.gold, textTransform: "uppercase", marginBottom: "0.75rem", fontFamily: "'DM Mono', monospace" } }, "⬡ MONEY FLOW INTELLIGENCE — " + n.short),
      ce("p", { style: { color: C.text, lineHeight: 1.85, fontSize: "0.88rem" } }, n.intel)
    ),
    ce("div", {
      style: {
        background: "rgba(196,60,60,0.06)",
        border: "1px solid " + C.red + "55",
        borderLeft: "3px solid " + C.red,
        borderRadius: 4,
        padding: "1.125rem"
      }
    },
      ce("div", { style: { fontSize: "0.58rem", letterSpacing: "3px", color: C.red, textTransform: "uppercase", marginBottom: "0.75rem", fontFamily: "'DM Mono', monospace" } }, "⚠ RISK ASSESSMENT — " + n.short),
      ce("p", { style: { color: C.text, lineHeight: 1.85, fontSize: "0.88rem" } }, n.risk)
    )
  );
}

/* ─── NATION CARD ─── */
function NationCard(props) {
  var n = props.nation;
  var tabState = useState("overview");
  var activeTab = tabState[0];
  var setTab = tabState[1];

  var tabContent = null;
  if (activeTab === "overview")     tabContent = ce(OverviewTab,  { nation: n });
  if (activeTab === "partners")     tabContent = ce(PartnersTab,  { nation: n });
  if (activeTab === "sectors")      tabContent = ce(SectorsTab,   { nation: n });
  if (activeTab === "events")       tabContent = ce(EventsTab,    { nation: n });
  if (activeTab === "intelligence") tabContent = ce(IntelTab,     { nation: n });

  var isSurplus = n.tradeBalance === "surplus";

  return ce("div", {
    style: {
      background: C.bg2,
      border: "1px solid " + C.border,
      borderRadius: 6,
      marginBottom: "2rem",
      overflow: "hidden",
      boxShadow: "0 4px 24px rgba(0,0,0,0.4)"
    }
  },
    /* ── Nation Header ── */
    ce("div", { style: { padding: "1.5rem clamp(1rem, 4vw, 1.75rem)", borderBottom: "1px solid " + C.border } },
      ce("div", { style: { display: "flex", alignItems: "flex-start", gap: "1rem", flexWrap: "wrap" } },
        /* Flag + number + name */
        ce("div", { style: { display: "flex", alignItems: "center", gap: "0.875rem", flex: 1, minWidth: 0 } },
          ce("span", { style: { fontSize: "clamp(1.5rem, 5vw, 2.5rem)", lineHeight: 1, flexShrink: 0 } }, n.flag),
          ce("div", { style: { minWidth: 0 } },
            ce("div", { style: { display: "flex", alignItems: "baseline", gap: "0.5rem", flexWrap: "wrap" } },
              ce("span", { style: { fontSize: "clamp(1.25rem, 4vw, 2rem)", fontFamily: "'DM Mono', monospace", color: C.goldD, opacity: 0.7, lineHeight: 1, fontWeight: 700 } }, n.no),
              ce("h2", { style: { fontSize: "clamp(1.2rem, 4vw, 1.875rem)", fontFamily: "'Playfair Display', serif", color: C.white, margin: 0, lineHeight: 1.15 } }, n.name)
            ),
            ce("div", { style: { fontSize: "0.75rem", color: C.muted, marginTop: "0.25rem", fontFamily: "'DM Mono', monospace" } }, n.gdp + " GDP — " + n.short)
          )
        ),
        /* Balance badge */
        ce("div", {
          style: {
            background: isSurplus ? "rgba(40,169,104,0.12)" : "rgba(196,60,60,0.12)",
            border: "1px solid " + (isSurplus ? C.green : C.red),
            borderRadius: 3,
            padding: "0.35rem 0.75rem",
            fontSize: "0.6rem",
            letterSpacing: "1.5px",
            color: isSurplus ? C.green : C.red,
            fontFamily: "'DM Mono', monospace",
            whiteSpace: "nowrap",
            alignSelf: "flex-start",
            flexShrink: 0
          }
        }, (isSurplus ? "▲ " : "▼ ") + n.balLabel)
      ),
      /* Headline */
      n.headline && ce("p", {
        style: {
          fontSize: "clamp(0.85rem, 2.5vw, 0.95rem)",
          color: C.text,
          marginTop: "1rem",
          lineHeight: 1.75,
          fontStyle: "italic",
          borderLeft: "2px solid " + C.goldD,
          paddingLeft: "0.875rem",
          maxWidth: 820
        }
      }, n.headline)
    ),

    /* ── Tabs ── */
    ce("div", { style: { padding: "1rem clamp(1rem, 4vw, 1.75rem) 1.75rem" } },
      ce(TabNav, { active: activeTab, onChange: setTab }),
      tabContent
    )
  );
}

/* ─── APP ─── */
function App() {
  return ce("div", { style: { background: C.bg, minHeight: "100vh" } },

    /* ── Site Header ── */
    ce("div", { style: { background: C.bg2, borderBottom: "1px solid " + C.border, padding: "1.5rem clamp(1rem, 5vw, 2.5rem)" } },
      ce("div", { style: { maxWidth: 1200, margin: "0 auto" } },
        ce("div", { style: { fontSize: "0.6rem", letterSpacing: "4px", color: C.goldD, textTransform: "uppercase", marginBottom: "0.3rem", fontFamily: "'DM Mono', monospace" } }, "// TRADE INTELLIGENCE BRIEF — DATA CURRENT TO 7 SEPTEMBER 2026"),
        ce("h1", { style: { fontSize: "clamp(1.5rem, 5vw, 2.75rem)", fontFamily: "'Playfair Display', serif", color: C.goldL, letterSpacing: "-0.5px", lineHeight: 1.1, marginBottom: "0.5rem" } }, "Global Trade Intelligence"),
        ce("p", { style: { fontSize: "0.875rem", color: C.muted, maxWidth: 720, lineHeight: 1.65 } },
          "Comprehensive analysis of world trade flows, tariff shocks, sector performance, cashflow intelligence, and geopolitical risk — current to 7 September 2026, incorporating trade data through July 2026, the Supreme Court’s IEEPA ruling, and the Strait of Hormuz energy shock. Covering the world’s 3 largest trading economies: United States · China · India."
        )
      )
    ),

    /* ── Ticker ── */
    ce(TickerBar, null),

    /* ── Nations ── */
    ce("div", { style: { maxWidth: 1200, margin: "0 auto", padding: "2rem clamp(1rem, 5vw, 2rem)" } },
      NATIONS.map(function(n) {
        return ce(NationCard, { key: n.id, nation: n });
      })
    ),

    /* ── Footer ── */
    ce("div", {
      style: {
        borderTop: "1px solid " + C.border,
        padding: "1.5rem clamp(1rem, 5vw, 2.5rem)",
        textAlign: "center",
        background: C.bg2
      }
    },
      ce("p", { style: { fontSize: "0.6rem", color: C.dim, letterSpacing: "0.75px", lineHeight: 1.9, maxWidth: 900, margin: "0 auto" } },
        "GLOBAL TRADE INTELLIGENCE REPORT · DATA SOURCES: WTO · IMF WORLD ECONOMIC OUTLOOK APR 2026 & COFER Q1 2026 · US CENSUS BUREAU / BEA (JULY 2026, REL. 3 SEP) · USTR · US SUPREME COURT (IEEPA, 20 FEB 2026) · CHINA NBS & GENERAL ADMINISTRATION OF CUSTOMS (JULY 2026) · INDIA MINISTRY OF COMMERCE, MoSPI & RBI · IEA · WORLD BANK · UNCTAD · PENN WHARTON BUDGET MODEL"
      ),
      ce("p", { style: { fontSize: "0.58rem", color: C.border, marginTop: "0.5rem", letterSpacing: "0.5px" } },
        "CURRENT TO 7 SEPTEMBER 2026 · LATEST HARD DATA: US & CHINA TRADE THROUGH JULY 2026, INDIA THROUGH JULY 2026, INDIA GDP THROUGH Q1 FY2026-27 · ANNUAL BAR CHARTS SHOW COMPLETED YEARS TO 2025; 2026 IS REPORTED AS YEAR-TO-DATE, NOT ANNUALISED · ALL FIGURES ARE OFFICIAL OR PARTNER-REPORTED STATISTICS AND MAY BE REVISED"
      )
    )
  );
}

/* ─── MOUNT ─── */
try {
  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App, null));
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="padding:2rem;max-width:640px;margin:0 auto;font-family:monospace;color:#c43c3c;line-height:1.7">'
    + '<strong>Report failed to render.</strong><br>' + String(err && err.message ? err.message : err)
    + '<br><br><span style="color:#6b7f9a">This usually means a script blocked by the network. Reload, or try a different network.</span></div>';
}
</script>
</body>
</html>
